services:
  pgapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pgapi
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
    volumes:
      - ~/.m2:/root/.m2
    networks:
      - mock-payment-network
    restart: unless-stopped

networks:
  mock-payment-network:
    external: true
    name: mock-payment-network
